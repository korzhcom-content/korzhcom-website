<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;font-family:Segoe UI,Roboto,Arial,sans-serif}
#c{position:relative;width:1600px;height:1120px}
.win{position:absolute;border-radius:12px;overflow:hidden;background:#fff;
  box-shadow:0 2px 4px rgba(0,0,0,.18),0 24px 60px rgba(10,20,60,.38)}
.bar{height:34px;background:#eef1f5;border-bottom:1px solid #dde2e8;display:flex;align-items:center;padding:0 14px;gap:8px}
.dot{width:12px;height:12px;border-radius:50%}
.r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
.url{margin-left:18px;flex:1;max-width:46%;height:20px;border-radius:10px;background:#fff;border:1px solid #dde2e8;
  font-size:12px;color:#6b7785;display:flex;align-items:center;padding-left:12px}
.win img{display:block;width:100%}
</style></head><body><div id="c">
 <div class="win" style="left:0;top:0;width:1040px"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><div class="url">Advanced search</div></div><img src="as.png"></div>
 <div class="win" style="left:700px;top:290px;width:880px"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><div class="url">EasyReport Starter Kit</div></div><img src="er.png"></div>
 <div class="win" style="left:90px;top:620px;width:800px"><div class="bar"><i class="dot r"></i><i class="dot y"></i><i class="dot g"></i><div class="url">Data filtering</div></div><img src="df.png"></div>
</div></body></html>
