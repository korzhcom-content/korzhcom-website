<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700" viewBox="0 0 600 700" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title>EasyQuery.JS with EasyQuery Server next to your backend</title>
  <defs>
    <marker id="o-model" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d9577a"/></marker>
    <marker id="o-query" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a9d5d"/></marker>
    <marker id="o-result" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a6cd4"/></marker>
    <marker id="o-sql" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1fa2b0"/></marker>
  </defs>

  <!-- Browser -->
  <rect x="20" y="20" width="560" height="190" rx="14" fill="#f5f6fb" stroke="#c5c8e0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="46" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6b6f99">BROWSER</text>
  <rect x="50" y="60" width="500" height="130" rx="10" fill="#ffffff" stroke="#d6d9ec"/>
  <text x="70" y="84" font-size="13" fill="#4a4d63">Your SPA or web page</text>
  <rect x="90" y="100" width="420" height="72" rx="8" fill="#595f96"/>
  <text x="300" y="130" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">EasyQuery.JS</text>
  <text x="300" y="154" font-size="12" fill="#dfe1f2" text-anchor="middle">query builder · result grid · charts</text>

  <!-- Server -->
  <rect x="20" y="290" width="560" height="390" rx="14" fill="#fbf8f1" stroke="#e2d6b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="40" y="316" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9a8550">SERVER</text>
  <rect x="50" y="330" width="390" height="150" rx="10" fill="#ffffff" stroke="#e6dcc4"/>
  <text x="245" y="376" font-size="16" font-weight="700" fill="#4a4d63" text-anchor="middle">Your application</text>
  <text x="245" y="400" font-size="12" fill="#7a7d90" text-anchor="middle">Java, Node.js, PHP, Python, .NET…</text>
  <text x="245" y="430" font-size="12" fill="#5c5f73" text-anchor="middle">forwards the requests of EasyQuery.JS</text>
  <text x="245" y="448" font-size="12" fill="#5c5f73" text-anchor="middle">and runs the SQL it gets back</text>

  <rect x="80" y="570" width="330" height="90" rx="8" fill="#eef0fa" stroke="#595f96" stroke-width="1.5"/>
  <text x="245" y="606" font-size="16" font-weight="700" fill="#3d4275" text-anchor="middle">EasyQuery Server</text>
  <text x="245" y="630" font-size="12" fill="#5a5f8a" text-anchor="middle">holds the data model · generates the SQL</text>

  <!-- Database -->
  <path d="M480,382 v76 a40,11 0 0 0 80,0 v-76" fill="#fff4dc" stroke="#d9b968" stroke-width="1.5"/>
  <ellipse cx="520" cy="382" rx="40" ry="11" fill="#ffe9b8" stroke="#d9b968" stroke-width="1.5"/>
  <text x="520" y="430" font-size="13" font-weight="600" fill="#7a6326" text-anchor="middle">Database</text>

  <!-- Browser <-> your application -->
  <line x1="140" y1="330" x2="140" y2="176" stroke="#d9577a" stroke-width="3" marker-end="url(#o-model)"/>
  <line x1="250" y1="172" x2="250" y2="326" stroke="#3a9d5d" stroke-width="3" marker-end="url(#o-query)"/>
  <line x1="380" y1="330" x2="380" y2="176" stroke="#4a6cd4" stroke-width="3" marker-end="url(#o-result)"/>
  <rect x="94" y="239" width="92" height="22" rx="11" fill="#ffffff" stroke="#d9577a"/>
  <text x="140" y="254" font-size="12" font-weight="600" fill="#b8405f" text-anchor="middle">Model JSON</text>
  <rect x="204" y="239" width="92" height="22" rx="11" fill="#ffffff" stroke="#3a9d5d"/>
  <text x="250" y="254" font-size="12" font-weight="600" fill="#2c7a48" text-anchor="middle">Query JSON</text>
  <rect x="334" y="239" width="92" height="22" rx="11" fill="#ffffff" stroke="#4a6cd4"/>
  <text x="380" y="254" font-size="12" font-weight="600" fill="#3653ad" text-anchor="middle">Result</text>

  <!-- Your application <-> EasyQuery Server -->
  <line x1="140" y1="570" x2="140" y2="484" stroke="#d9577a" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#o-model)"/>
  <line x1="250" y1="480" x2="250" y2="566" stroke="#3a9d5d" stroke-width="3" marker-end="url(#o-query)"/>
  <line x1="380" y1="570" x2="380" y2="484" stroke="#1fa2b0" stroke-width="3" marker-end="url(#o-sql)"/>
  <rect x="94" y="514" width="92" height="22" rx="11" fill="#ffffff" stroke="#d9577a"/>
  <text x="140" y="529" font-size="12" font-weight="600" fill="#b8405f" text-anchor="middle">Model JSON</text>
  <rect x="204" y="514" width="92" height="22" rx="11" fill="#ffffff" stroke="#3a9d5d"/>
  <text x="250" y="529" font-size="12" font-weight="600" fill="#2c7a48" text-anchor="middle">Query JSON</text>
  <rect x="334" y="514" width="92" height="22" rx="11" fill="#ffffff" stroke="#1fa2b0"/>
  <text x="380" y="529" font-size="12" font-weight="600" fill="#157a85" text-anchor="middle">SQL</text>

  <!-- Your application <-> database -->
  <line x1="440" y1="402" x2="474" y2="402" stroke="#1fa2b0" stroke-width="3" marker-end="url(#o-sql)"/>
  <text x="458" y="394" font-size="11" font-weight="600" fill="#157a85" text-anchor="middle">SQL</text>
  <line x1="480" y1="446" x2="446" y2="446" stroke="#4a6cd4" stroke-width="3" marker-end="url(#o-result)"/>
  <text x="462" y="464" font-size="11" font-weight="600" fill="#3653ad" text-anchor="middle">Result</text>
</svg>
