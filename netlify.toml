[build]
  command = "npm run build && bundle exec jekyll build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "24"
  RUBY_VERSION = "3.3.0"
  NODE_ENV     = "production"
  JEKYLL_ENV   = "production"
  # Force devDependencies to install. Netlify skips them when NODE_ENV=production,
  # but esbuild + cross-env + concurrently live in devDependencies and we need
  # them to run `npm run build` in CI.
  NPM_FLAGS    = "--production=false"

[[headers]]
  for = "*.*"
  [headers.values]
    cache-control = "max-age=604800"
